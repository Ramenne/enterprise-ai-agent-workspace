<!doctype html><meta charset="utf-8"><title>语音链路候选验收</title><style>body{font:15px sans-serif;background:#ededed;padding:18px}button{margin:8px;padding:12px;border:1px solid #ddd;background:white}pre{white-space:pre-wrap}</style><h2>语音候选：真实本人、独立测试库、合成音频</h2><button id="init">连接当前本人</button><button data-target="assistant" disabled>助手语音</button><button data-target="group" disabled>群聊语音</button><button data-target="direct" disabled>萱萱私聊语音</button><button id="text" disabled>文字发送与刷新耗时</button><button id="metadata" disabled>验证上传初始属性</button><button id="large" disabled>上传合成视频到助手</button><input id="large-file" type="file" accept="video/*" hidden><video controls></video><pre id="result"></pre><audio controls></audio><script type="module">
import {createPinia,setActivePinia} from 'pinia';setActivePinia(createPinia());
import {NativeClient} from '/src/native/client.mjs';import {configureApi,apiRequest} from '/src/api/client.ts';import {communication} from '/src/api/endpoints.ts';import {startChatTransfer} from '/src/files/chatTransfers.ts';import {findAttachment} from '/src/collaboration/media.ts';import {getChatDownload} from '/src/chat/files.ts';
let actor,peer;const out=document.querySelector('#result');document.querySelector('#init').onclick=async()=>{try{const member=await new NativeClient().session();actor=member.identity.actor_id;configureApi({apiBase:'',getAccount:()=>actor,getEpoch:()=>0,onUnauthorized:()=>{actor='';}});const bootstrap=await apiRequest('GET','/business/v1/bootstrap');configureApi({fastMedia:bootstrap.capabilities.fast_media===true});const directory=await communication.members();peer=directory.members.find(m=>m.username==='968d090b-3c61-4144-a737-4738797cd8a2')?.username;if(!peer)throw Error('指定验收成员不在当前目录');for(const b of document.querySelectorAll('[data-target]'))b.disabled=false;document.querySelector('#text').disabled=false;document.querySelector('#metadata').disabled=false;document.querySelector('#large').disabled=false;out.textContent='已连接真实本人；仅测试库消息，音频是程序合成正弦波。';}catch(e){out.textContent='连接失败：'+e.message;}};
document.querySelector('#large').onclick=()=>document.querySelector('#large-file').click();document.querySelector('#large-file').onchange=async e=>{try{let file=e.target.files[0];const started=performance.now();if(!file||file.name!=='员工客户端合成传输测试.mp4')throw Error('只使用已生成的合成视频');const tail=new Uint8Array(await file.slice(file.size-1).arrayBuffer());tail[0]^=1;file=new File([file.slice(0,file.size-1),tail],'合成链路验收-'+crypto.randomUUID()+'.mp4',{type:'video/mp4',lastModified:Date.now()});const job=startChatTransfer(file,'qn-chain-video-'+crypto.randomUUID(),actor,{body:'',attachment_ids:[],mention_usernames:[]},'file');if(!await job.promise)throw Error(job.error);const sentMs=Math.round(performance.now()-started),a={...job.attachment,kind:'video',version:job.attachment.ver+':'+job.attachment.sha256},local=await findAttachment(a,{account:actor,computer:'cloud',provider:'company',thread:'group'});if(!local)throw Error('缓存未保留');document.querySelector('video').src=local.url;out.textContent=JSON.stringify({largeVideo:'passed',size:file.size,sentMs,localCached:local.cached,mime:job.attachment.mime,receiptConfirmed:!!job.messageId});}catch(e){out.textContent='视频未通过：'+e.message;}};
document.querySelector('#metadata').onclick=async()=>{try{const c=new NativeClient(),f=new File(['public synthetic fixture'],'属性验收.txt',{type:'text/plain'}),q={employeeclient:{name:f.name,mime:f.type,purpose:'file',source_key:'initial-property-check'}};const op=await c.prepareUpload('ad44cc0e-159e-4e0f-a5ca-73d3920240d9',f,'qn-initial-props-'+crypto.randomUUID(),undefined,q),r=await c.finishUpload(op,f),h=await c.head(op.project_id,r.fixed_refs[0].material_id);out.textContent=JSON.stringify({initialProperties:h.properties,match:Object.entries(q.employeeclient).every(([k,v])=>h.properties.employeeclient[k]===v),fixedVerified:h.fixed_ref.sha256===r.fixed_refs[0].sha256});}catch(e){out.textContent='初始属性未通过：'+e.message;}};
document.querySelector('#text').onclick=async()=>{try{const started=performance.now();const r=await communication.send({body:'发送性能验收（仅测试库）',attachment_ids:[],mention_usernames:[],recipient_username:actor},'qn-latency-'+crypto.randomUUID());const sent=Math.round(performance.now()-started),refresh=performance.now();await Promise.all([communication.messages({peer:actor,limit:50}),communication.changes(0,undefined,actor)]);out.textContent=JSON.stringify({textSendMs:sent,parallelRefreshMs:Math.round(performance.now()-refresh),receiptConfirmed:!!r.message.id});}catch(e){out.textContent=e.message;}};
for(const button of document.querySelectorAll('[data-target]'))button.onclick=async()=>{let timer;try{const sampleRate=16000,samples=64000,buffer=new ArrayBuffer(44+samples*2),view=new DataView(buffer);const text=(offset,s)=>{for(let i=0;i<s.length;i++)view.setUint8(offset+i,s.charCodeAt(i));};text(0,'RIFF');view.setUint32(4,36+samples*2,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,samples*2,true);for(let i=0;i<samples;i++)view.setInt16(44+i*2,Math.sin(2*Math.PI*440*i/sampleRate)*3000,true);const file=new File([buffer],'语音合成验收.wav',{type:'audio/wav'}),target=button.dataset.target,recipient=target==='assistant'?actor:target==='direct'?peer:'';const started=performance.now(), stages=[];let lastStage='';const job=startChatTransfer(file,'qn-voice-check-'+target+'-'+crypto.randomUUID(),recipient,{body:'',attachment_ids:[],mention_usernames:[]},'voice',4000);timer=setInterval(()=>{if(job.stage!==lastStage){stages.push({stage:job.stage,ms:Math.round(performance.now()-started)});lastStage=job.stage;}out.textContent=target+'：'+job.stage;},50);if(!await job.promise)throw Error(job.error);const elapsed=Math.round(performance.now()-started),requests=performance.getEntriesByType('resource').filter(r=>r.startTime>=started&&/native|business/.test(r.name)).map(r=>({path:new URL(r.name).pathname,ms:Math.round(r.duration)}));const source=await getChatDownload(job.attachment.id,undefined,job.attachment);document.querySelector('audio').src=source.download_url;out.textContent='通过：'+target+'，已确认消息 '+job.messageId+'，purpose='+job.attachment.purpose+'，时长='+job.attachment.duration_ms+'ms。'+JSON.stringify({elapsed,stages,requests});}catch(e){out.textContent='未通过：'+e.message;}finally{clearInterval(timer);}};
</script>

<!doctype html><meta charset="utf-8"><title>文件传输候选验收</title><style>body{font:15px sans-serif;padding:20px;background:#ededed}button,a{display:inline-block;margin:10px;padding:12px;background:white;border:1px solid #ddd;border-radius:6px}pre{white-space:pre-wrap}canvas{display:block}</style><h2>本地候选：大文件与视频验收</h2><button id="cache">验证70MB磁盘缓存与重进读取</button><button id="video">生成17MB真实测试视频</button><pre id="result"></pre><canvas width="160" height="120"></canvas><div id="download"></div><script type="module">
import {loadAttachment,findAttachment,sourceIdentity} from '/src/collaboration/media.ts';
import {attachmentKey,removeBlob} from '/src/platform/attachmentCache.ts';
import {sha256} from '/node_modules/@noble/hashes/sha2.js';import {bytesToHex} from '/node_modules/@noble/hashes/utils.js';
const output=document.querySelector('#result');document.querySelector('#cache').onclick=async()=>{let media,reopened;const ctx={account:'qa-synthetic-file-transfer',computer:'cloud',provider:'company',thread:'group'},size=70*1024*1024,bytes=new Uint8Array(524288),h=sha256.create();for(let n=0;n<size;n+=bytes.length)h.update(bytes);const a={id:'qa-large-'+Date.now(),name:'70MB-cache-check.bin',mime:'application/octet-stream',kind:'file',size,sha256:bytesToHex(h.digest()),version:'1'};let key;try{key=await attachmentKey(sourceIdentity(a,ctx));output.textContent='正在验证实际浏览器OPFS…';media=await loadAttachment(a,ctx,new AbortController().signal,(n)=>output.textContent='写入 '+Math.floor(n/size*100)+'%',{size,readPart:async(s,e)=>new Blob([bytes.subarray(0,e-s)])});media.dispose();media=undefined;reopened=await findAttachment(a,ctx);if(!reopened?.cached||reopened.uploadSource.size!==size)throw Error('缓存重进失败');const part=await reopened.uploadSource.slice(64*1024*1024,64*1024*1024+16).arrayBuffer();if(new Uint8Array(part).some(Boolean))throw Error('字节不符');output.textContent='通过：70MB实际磁盘缓存、校验、重进读取及分块读取；未访问生产服务。';}catch(e){output.textContent='失败：'+e.message;}finally{media?.dispose();reopened?.dispose();if(key)await removeBlob(key);}};
document.querySelector('#video').onclick=async()=>{try{const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),stream=canvas.captureStream(5),mime=['video/mp4','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw Error('浏览器没有视频录制格式');const rec=new MediaRecorder(stream,{mimeType:mime}),parts=[];rec.ondataavailable=e=>parts.push(e.data);const ended=new Promise(r=>rec.onstop=r);rec.start();for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#21966d':'#256091';ctx.fillRect(0,0,160,120);ctx.fillStyle='white';ctx.font='20px sans-serif';ctx.fillText('员工客户端测试 '+i,10,60);await new Promise(r=>setTimeout(r,200));}rec.stop();await ended;stream.getTracks().forEach(t=>t.stop());const filler=17*1024*1024,header=mime.includes('mp4')?new Uint8Array([(filler+8)>>>24,((filler+8)>>>16)&255,((filler+8)>>>8)&255,(filler+8)&255,102,114,101,101]):new Uint8Array([236,0x10|(filler>>>24),(filler>>>16)&255,(filler>>>8)&255,filler&255]);const blob=new Blob([...parts,header,new Uint8Array(filler)],{type:mime}),a=document.createElement('a');a.textContent='下载员工客户端合成测试视频';a.href=URL.createObjectURL(blob);a.download='员工客户端合成传输测试.'+(mime.includes('mp4')?'mp4':'webm');document.querySelector('#download').replaceChildren(a);output.textContent='已生成 '+(blob.size/1048576).toFixed(2)+'MB '+mime+'；仅合成色块和测试文字。';}catch(e){output.textContent='生成失败：'+e.message;}};
</script>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识文档管理库 · 协作平台工具合集</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/knowledge/assets/library.css?v=20261014a"><script type="module" src="/knowledge/assets/library.js?v=20261020a"></script></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h6c2 0 3 1 3 2v15c0-2-2-3-4-3H3zM21 4h-6c-2 0-3 1-3 2v15c0-2 2-3 4-3h5z"/></svg></span><h1>知识文档管理库</h1></div><nav><button id="refresh">刷新</button><button id="create" class="primary" hidden>新建知识</button><a class="back" href="/">← 返回主界面</a></nav></header>
<main><aside><h2>知识分类</h2><nav id="categories" aria-label="知识分类"></nav><h2>文档</h2><button class="archive-filter active" data-value="active">使用中 <span id="active-count">0</span></button><button class="archive-filter" data-value="archived">已归档 <span id="archived-count">0</span></button><p class="side-note">从教学到实践，<br>所有中枢成员均可入库，<br>保存时请标明来源。</p></aside>
<section class="workspace"><div class="toolbar"><input id="search" type="search" placeholder="搜索知识、摘要、标签或来源" aria-label="搜索知识"><select id="status" aria-label="按验证状态筛选"><option value="">全部状态</option><option value="unverified">待验证</option><option value="research">研究资料</option><option value="verified">已验证</option><option value="partial">部分验证</option><option value="needs_revalidation">待复核</option></select><span id="count"></span></div><p id="feedback" role="status" aria-live="polite"></p><div id="items"></div></section></main>
<dialog id="reader"><div class="dialog-head"><div><h2 id="reader-title"></h2><p id="reader-meta"></p></div><button data-close="reader" aria-label="关闭阅读">×</button></div><div class="reader-toolbar"><label>版本 <select id="versions"></select></label><a id="download" class="button">下载 Markdown</a></div><div class="reader-scroll"><div id="reader-state"></div><p id="reader-summary"></p><div id="reader-links" class="reader-links"></div><div id="conditions"></div><article id="document" class="prose"></article><details class="provenance"><summary>来源与验证记录</summary><div id="provenance"></div></details><p id="reader-feedback" role="alert"></p></div><div class="dialog-foot"><span id="version-note"></span><button data-close="reader">关闭</button></div></dialog>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><div><h2 id="editor-title">新建知识文档</h2><p>正文保存到资料存储服务；每次修改保留独立历史版本。</p></div><button type="button" data-close="editor" aria-label="关闭编辑">×</button></div><div class="dialog-body"><label>导入已有正文<input id="import-file" type="file" accept=".md,.txt,.json"><span class="hint">Markdown、纯文本，或含 document.body 的知识 JSON。导入后可补充来源与验证状态。</span></label><label>标题<input id="title" required maxlength="180"></label><div class="form-grid"><label>分类<input id="category" maxlength="80" list="category-options" placeholder="例如：Agent、图像制作"><datalist id="category-options"></datalist></label><label>标签<input id="tags" maxlength="300" placeholder="以逗号分隔"></label></div><label>摘要<textarea id="summary" maxlength="2000" rows="2" placeholder="这份知识解决什么问题"></textarea></label><div class="form-grid"><label>保存项目<select id="project" required><option value="">正在读取项目…</option></select></label><label>验证状态<select id="edit-status"><option value="unverified">待验证</option><option value="research">研究资料</option><option value="verified">已验证</option><option value="partial">部分验证</option><option value="needs_revalidation">待复核</option></select></label></div><div class="form-grid"><label>来源说明<input id="source-name" maxlength="180" placeholder="讲师、文档名称、项目实践或本人原创"></label><label>来源视频 / 网页<input id="source-url" type="url" maxlength="2000" placeholder="https://"></label></div><p class="hint">来源说明或来源链接至少填写一项；上传成员由系统自动记录。</p><label>适用范围<textarea id="scope" maxlength="3000" rows="2"></textarea></label><label>限制与未验证内容<textarea id="limitations" maxlength="5000" rows="2"></textarea></label><label>验证依据<textarea id="evidence" maxlength="12000" rows="2" placeholder="实际成果、验证报告或证据地址；已验证和部分验证必须填写"></textarea></label><label>知识正文<textarea id="body" required rows="15" placeholder="使用 Markdown 编写方法步骤、条件和结果。"></textarea></label><div class="form-grid"><label>关联 HTML 汇报<select id="report"><option value="">暂不关联</option></select></label><label>关联 Skill<select id="skill"><option value="">暂不关联</option></select></label></div><p id="editor-feedback" role="alert"></p></div><div class="dialog-foot"><button type="button" data-close="editor">取消</button><button id="save" type="submit" class="primary">保存文档</button></div></form></dialog>
</body></html>

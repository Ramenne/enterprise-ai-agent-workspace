<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>硬件采购平台 · 协作平台工具合集</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/hardware/assets/app.css?v=20261014c"><script defer src="/hardware/assets/app.js?v=20261014c"></script></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h2l2 12h12l2-9H6M9 20h.01M18 20h.01M10 3v6m-3-3h6"/></svg></span><h1>硬件采购平台</h1></div><nav><button id="refresh">刷新</button><button id="new" class="primary" disabled>新增采购</button><a href="/">← 返回主界面</a></nav></header>
<main><div class="intro"><div><h2>采购记录</h2><p>记录每一次硬件购买，保留商品明细、实际支付和购买凭证。</p></div><span id="me"></span></div><section class="stats" aria-label="采购统计"><div><span>采购记录</span><strong id="total">—</strong></div><div><span>实际支付合计</span><strong id="paid">—</strong></div><div><span>待补凭证</span><strong id="missing">—</strong></div></section>
<section class="records"><div class="tabs" role="group" aria-label="记录状态"><button id="active" class="selected" aria-pressed="true">采购记录</button><button id="archived" aria-pressed="false">已归档</button></div><form id="filters" class="filters"><input id="search" type="search" maxlength="200" placeholder="搜索商品、型号、成员或备注" aria-label="搜索采购记录"><select id="buyer-filter" aria-label="购买人"><option value="">全部购买人</option></select><select id="platform-filter" aria-label="购买平台"><option value="">全部平台</option></select><label>购买日期<input id="from" type="date" aria-label="起始日期"></label><span class="separator">至</span><input id="to" type="date" aria-label="结束日期"><button type="submit">查询</button><button id="reset" type="button" class="quiet">清空</button></form>
<p id="feedback" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>购买内容</th><th>购买平台 / 日期</th><th>购买人 / 登记人</th><th>实际支付</th><th>凭证</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="empty" hidden><div class="empty-icon">＋</div><h3>还没有采购记录</h3><p>点击“新增采购”，登记购买内容与凭证。</p></div><footer class="pagination"><span id="result-count"></span><div><button id="prev" disabled>上一页</button><span id="page">1</span><button id="next" disabled>下一页</button></div></footer></section><p class="scope-note">中枢成员可查看全部采购记录；登记人和管理员可修改、归档和恢复。</p></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><div><h2 id="editor-title">新增采购</h2><p id="registrar"></p></div><button type="button" data-close="editor" aria-label="关闭">×</button></div><fieldset id="fields"><div class="dialog-body"><section class="form-section"><h3>购买信息</h3><div class="form-grid"><label>购买平台 <span class="required">*</span><input id="platform" list="platform-options" maxlength="80" required placeholder="选择或填写购买平台"><datalist id="platform-options"></datalist></label><label>购买日期 <span class="required">*</span><input id="date" type="date" required></label><label>购买人 <span class="required">*</span><select id="buyer" required></select></label><label>使用人 <span class="optional">选填</span><select id="user"><option value="">未指定</option></select></label><label class="full">关联项目 <span class="optional">选填</span><select id="project"><option value="">不关联项目</option></select><span id="project-hint" class="hint">只列出本人有权查看的中枢项目。</span></label></div></section>
<section class="form-section"><div class="section-head"><h3>商品明细</h3><button type="button" id="add-line">＋ 添加商品</button></div><div id="lines"></div><p class="hint">一笔订单可登记多件商品；单价和数量用于核对，实际支付总额单独记录。</p></section>
<section class="form-section"><h3>购买金额 <small>人民币 · 元</small></h3><div class="form-grid three"><label>实际支付总额 <span class="required">*</span><input id="paid-amount" type="number" min="0" max="100000000" step="0.01" required placeholder="0.00"></label><label>运费 <span class="optional">选填</span><input id="shipping" type="number" min="0" max="100000000" step="0.01" placeholder="0.00"></label><label>优惠 <span class="optional">选填</span><input id="discount" type="number" min="0" max="100000000" step="0.01" placeholder="0.00"></label></div><p id="amount-hint" class="hint"></p></section>
<section class="form-section"><h3>购买凭证 <span class="optional">可后补</span></h3><label class="upload">选择图片或 PDF<input id="files" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,application/pdf"><span class="hint">订单截图、付款截图、发票等；最多 12 份，每份 10 MB，总计 30 MB。</span></label><div id="file-list"></div></section><label>备注 <span class="optional">选填</span><textarea id="note" rows="3" maxlength="4000" placeholder="记录购买用途或其他说明"></textarea></div></fieldset><div class="dialog-foot"><p id="editor-feedback" role="alert"></p><button type="button" data-close="editor">取消</button><button id="save" type="submit" class="primary">保存采购</button></div></form></dialog>
<dialog id="detail"><div class="dialog-head"><div><h2 id="detail-title">采购详情</h2><p id="detail-subtitle"></p></div><button data-close="detail" aria-label="关闭">×</button></div><div id="detail-body" class="dialog-body"></div><div class="dialog-foot"><button id="detail-edit">编辑</button><button id="detail-archive">归档</button><button data-close="detail">关闭</button></div></dialog>
<dialog id="archive-confirm"><form id="archive-form"><div class="dialog-head"><h2 id="archive-title">归档采购记录</h2></div><div class="dialog-body"><p id="archive-message">归档后可以在“已归档”中查看和恢复，明细与凭证会保留。</p><p id="archive-feedback" role="alert"></p></div><div class="dialog-foot"><button type="button" data-close="archive-confirm">取消</button><button id="archive-submit" class="primary" type="submit">确认归档</button></div></form></dialog>
</body></html>

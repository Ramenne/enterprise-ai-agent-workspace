<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill 管理库 · 协作平台工具合集</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/skills/assets/library.css?v=20261014d"><script defer src="/skills/assets/library.js?v=20261014d"></script></head><body>
<header><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h5"/></svg></span><h1>Skill 管理库</h1></div><nav class="header-actions" aria-label="工具操作"><button id="refresh">刷新</button><button class="primary" id="import">导入 Skill</button><a class="back" href="/">← 返回主界面</a></nav></header>
<main><aside><h2>分组</h2><nav id="categories" aria-label="分组"></nav><h2>状态</h2><button class="status active" data-status="active">使用中 <span id="active-count">0</span></button><button class="status" data-status="archived">已归档 <span id="archived-count">0</span></button><p class="side-note">成员可查看和下载。<br>上传者与管理员可维护。</p></aside><section class="workspace"><div class="toolbar"><input type="search" id="search" placeholder="搜索名称、说明、标签或上传人" aria-label="搜索 Skill"><span id="count"></span></div><p id="feedback" role="status" aria-live="polite"></p><div id="items" class="items"></div></section></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="editor-title">导入 Skill</h2><button type="button" data-close="editor" aria-label="关闭">×</button></div><div class="dialog-body"><label id="file-label">Skill 文件<input type="file" id="package" accept=".md,.zip"><span class="hint">SKILL.md 或包含 SKILL.md 和配套文件的 ZIP，最大 5 MB。</span></label><section id="package-preview" class="package-preview" aria-label="导入预览" hidden><div class="package-heading"><strong id="package-name"></strong><span id="package-stats"></span></div><p id="package-description"></p><details><summary>查看包含的文件</summary><ul id="package-files"></ul></details></section><label id="title-label">显示名称<input id="title" maxlength="180" placeholder="留空时使用 Skill 的 name"></label><div class="form-grid" id="metadata-fields"><label>分组<input id="category" maxlength="80" list="category-options" placeholder="未分组"><datalist id="category-options"></datalist></label><label>标签<input id="tags" maxlength="300" placeholder="例如：文档、设计"></label></div><label id="version-label">版本备注<input id="version-note" maxlength="100" placeholder="例如：v1.0 · 初始版本"></label><label id="note-label">备注<textarea id="note" maxlength="2000" rows="3"></textarea></label><p id="editor-feedback" role="alert"></p></div><div class="dialog-foot"><button type="button" data-close="editor">取消</button><button type="submit" class="primary" id="save">保存</button></div></form></dialog>
<dialog id="detail"><div class="dialog-head"><div><h2 id="detail-title"></h2><p id="detail-subtitle"></p></div><button data-close="detail" aria-label="关闭">×</button></div><div class="detail-summary"><p id="detail-description"></p><p id="detail-note" hidden></p></div><div class="detail-toolbar"><label>版本 <select id="versions"></select></label><a id="download" class="button primary">下载此版本</a></div><div class="detail-body"><div class="files"><h3>文件</h3><div id="files"></div></div><div class="source"><h3 id="file-name">SKILL.md</h3><pre id="content"></pre><p id="detail-feedback" role="status"></p></div></div><div class="dialog-foot"><span id="version-info"></span><button data-close="detail">关闭</button></div></dialog>
</body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML 管理库 · 协作平台工具合集</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/html/assets/library.css?v=20261013"><script type="module" src="/html/assets/library.js?v=20261013"></script></head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg></span><span>HTML 管理库</span></div><a class="back" href="/">← 返回主界面</a></header>
<div class="layout"><aside><div class="aside-label">来源</div><nav class="sources" aria-label="资料来源"><button id="cloud-source" aria-current="true">资料存储服务</button></nav><div class="aside-label">项目</div><nav id="projects" aria-label="项目分类"></nav><div class="aside-bottom"><span id="member-name"></span><p>集中整理 HTML 资料与作品</p></div></aside>
<main><div class="heading"><div><div class="eyebrow">协作平台工具合集</div><h1>HTML 成果</h1><p>浏览中枢统一 HTML 图书馆，按项目查找、预览和打开。</p></div><button id="add" class="primary" hidden>＋ 上传到资料存储服务</button></div>
<p id="cloud-progress" class="cloud-progress" role="status" aria-live="polite"></p><p id="cloud-error" class="error" role="alert" hidden></p><div class="toolbar"><div class="tabs" role="group" aria-label="成果状态"><button id="active-tab" aria-pressed="true">成果 <span id="active-count">0</span></button></div><div><button id="refresh">刷新列表</button><button id="sync" hidden>同步资料存储服务</button></div></div>
<div class="filters"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索名称、项目或备注" aria-label="搜索成果"></label><select id="kind" aria-label="成果类型"><option value="">全部类型</option><option>资料</option><option>作品</option><option>其他</option></select><select id="sort" aria-label="排序"><option value="updated">最近更新</option><option value="created">最近收录</option><option value="title">名称排序</option></select></div>
<div class="result-line"><span id="result-count">正在读取…</span><span id="status" role="status" aria-live="polite"></span></div>
<section id="items" aria-label="HTML 成果列表"></section>
<div id="empty" class="empty" hidden><div class="empty-icon" aria-hidden="true">&lt;/&gt;</div><h2 id="empty-title">还没有成果</h2><p id="empty-description">上传第一个 HTML，让资料和作品更容易找到。</p></div>
<p class="footnote">所有中枢成员浏览同一份目录，管理操作仅管理员可用。上传直接保存到选定的资料存储服务项目，文件、版本和权限以资料存储服务为准；单个上传最大 2 MB。预览停用外部脚本、接口和相邻文件。</p>
</main></div>
<dialog id="editor" aria-labelledby="editor-title"><div class="dialog-heading"><h2 id="editor-title">上传 HTML</h2><button type="button" data-close="editor" aria-label="关闭上传表单">✕</button></div><form id="form"><label id="file-label" class="file-picker">HTML 文件<input id="file" type="file" accept=".html,.htm,text/html" required><span id="file-note">选择可独立打开的 .html 或 .htm 文件</span></label><label>名称<input name="title" required maxlength="180" placeholder="例如：资料存储服务重构方案"></label><div class="pair"><label>保存到资料存储服务项目<select name="projectId" id="upload-project" required><option value="">请选择项目</option></select></label><label>类型<select name="kind"><option>资料</option><option>作品</option><option>其他</option></select></label></div><label>保存路径<input name="path" required maxlength="500" placeholder="HTML成果/文件名.html"><span>已有不同内容的同路径文件会提示更换路径。</span></label><label>备注（选填）<textarea name="note" maxlength="2000" rows="3" placeholder="记录用途或内容"></textarea></label><p id="editor-error" class="error" role="alert"></p><div class="form-footer"><button type="button" data-close="editor">取消</button><button id="save" class="primary" type="submit">上传</button></div></form></dialog>
<dialog id="preview" class="preview-dialog" aria-labelledby="preview-title"><div class="dialog-heading"><div><h2 id="preview-title">预览</h2><p id="preview-meta"></p></div><div class="preview-actions"><a id="preview-open" target="_blank" rel="noopener" class="button">新窗口打开 ↗</a><button type="button" data-close="preview" aria-label="关闭预览">✕</button></div></div><iframe id="frame" title="HTML 成果预览" sandbox="allow-scripts allow-downloads" referrerpolicy="no-referrer"></iframe><div class="preview-foot">独立 HTML 预览。外部脚本和接口在预览中停用。</div></dialog>
</body></html>

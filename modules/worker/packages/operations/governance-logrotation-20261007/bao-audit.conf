/var/log/workspace-hub2/bao/audit.jsonl {
    daily
    maxsize 100M
    rotate -1
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%dT%H%M%S
    create 0600
    postrotate
        /bin/systemctl kill --kill-who=main --signal=HUP hub2-bao.service
    endscript
}

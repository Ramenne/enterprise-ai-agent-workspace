/var/log/messages /var/log/secure /var/log/cron {
    daily
    maxsize 100M
    rotate -1
    maxage 14
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%dT%H%M%S
    create 0600 root root
    sharedscripts
    postrotate
        /bin/systemctl reload rsyslog.service
    endscript
}
